<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Title Here</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>
<h1>REGISTRATION FORM</h1>
<form class="RegForm" onsubmit="return validateForm()" onreset="resetErrors()">
  <p>
    <label for="name">Name:</label>
    <input type="text" id="name" name="Name" placeholder="Enter Your Full Name"/>
    <span id="name-error" class="error-message"></span>
  </p>
  <p>
    <label for="address">Address:</label>
    <input type="text" id="address" name="Address" placeholder="Enter Your Address"/>
    <span id="address-error" class="error-message"></span>
  </p>
  <p>
    <label for="email">E-Mail:</label>
    <input type="text" id="email" name="Email" placeholder="Enter your Email Address"/>
    <span id="email-error" class="error-message"></span>
  </p>
  <p>
    <label for="password">Password:</label>
    <input type="password" id="password" name="Password" placeholder="Enter your Password"/>
    <span id="password-error" class="error-message"></span>
  </p>
  <p>
  <label for="subject">Select Your Course:</label>
  <select id="subject" name="Subject">
    <option value="">Select Course</option>
    <option value="BTECH">B.Tech</option>
    <option value="BBA">BBA</option>
    <option value="BCA">BCA</option>
    <option value="BSC">B.Sc</option>
    <option value="BCOM">B.Com</option>
  </select>
    <span id="subject-error" class="error-message"></span>
  </p>
  <p>
    <label for="comment">College Name:</label>
    <textarea id="comment" name="Comment"></textarea>
  </p>
  <p>
    <input type="checkbox" id="agree" name="Agree"/>
    <label for="agree">I Agree to the above Informations</label>

    <span id="agree-error" class="error-message"></span>
  </p>
  <p>
    <input type="submit" value="Send" name="Submit" />
    <input type="reset" value="Reset" name="Reset" />
  </p>
</form>
</body>
</html>
